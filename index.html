<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SK life science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFFFFF;
      overflow: hidden;
    }
    .banner {
      position: relative;
      height: 100%;
      min-height: 140px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      padding-left: 48px;
    }
    /* Left edge strip: red cap, orange body */
    .strip {
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 100%;
      background: linear-gradient(180deg, #E4002B 0, #E4002B 14px, #F57C00 14px, #F57C00 100%);
    }
    /* Right side curved swoosh */
    .swoosh {
      position: absolute;
      right: 0;
      top: 0;
      width: 270px;
      height: 100%;
      display: block;
    }
    /* Soft shadow along the bottom edge */
    .shadow {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.22));
      pointer-events: none;
    }
    .logo {
      position: relative;
      z-index: 1;
      height: 110px;
      width: auto;
      display: block;
    }
    @media (max-width: 560px) {
      .swoosh { width: 140px; }
      .logo { height: 80px; }
      .banner { padding-left: 28px; }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="strip"></div>

    <svg class="swoosh" viewBox="0 0 270 284" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="swooshGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F57C00"/>
          <stop offset="0.55" stop-color="#E8520A"/>
          <stop offset="1" stop-color="#D41E0A"/>
        </linearGradient>
      </defs>
      <path d="M0,0 C50,5 90,40 100,100 C108,150 110,200 125,284 L270,284 L270,0 Z" fill="url(#swooshGrad)"/>
    </svg>

    <svg class="logo" viewBox="0 0 350 130" role="img" aria-label="SK life science logo">
      <!-- Butterfly mark -->
      <g stroke-linejoin="round" stroke-width="3">
        <path d="M53,12 L90,34 L70,60 Z" fill="#F57C00" stroke="#F57C00"/>
        <path d="M92,30 L112,40 L106,62 L94,50 Z" fill="#E4002B" stroke="#E4002B"/>
        <path d="M112,40 L132,32 L128,54 L108,62 Z" fill="#E4002B" stroke="#E4002B"/>
        <path d="M118,58 L142,56 L128,68 Z" fill="#F57C00" stroke="#F57C00"/>
      </g>
      <!-- Wordmark -->
      <text x="2" y="118" font-family="Nunito, 'Arial Rounded MT Bold', Arial, sans-serif"
            font-size="62" font-weight="900" fill="#E4002B">SK</text>
      <text x="104" y="117" font-family="Nunito, 'Arial Rounded MT Bold', Arial, sans-serif"
            font-size="40" font-weight="700" fill="#F68B1F"
            textLength="240" lengthAdjust="spacingAndGlyphs">life science</text>
    </svg>

    <div class="shadow"></div>
  </div>
</body>
</html>
