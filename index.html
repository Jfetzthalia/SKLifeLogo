  <title>SK life science</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFFFFF;
      overflow: hidden;
    }
    .banner {
      position: relative;
      height: 100%;
      min-height: 140px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      padding-left: 48px;
    }
    /* Left edge strip: red cap, orange body */
    .strip {
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 100%;
      background: linear-gradient(180deg, #E4002B 0, #E4002B 14px, #F57C00 14px, #F57C00 100%);
    }
    /* Right side curved swoosh */
    .swoosh {
      position: absolute;
      right: 0;
      top: 0;
      width: 270px;
      height: 100%;
      display: block;
    }
    /* Soft shadow along the bottom edge */
    .shadow {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.22));
      pointer-events: none;
    }
    .logo {
      position: relative;
      z-index: 1;
      height: 110px;
      width: auto;
      display: block;
    }
    @media (max-width: 560px) {
      .swoosh { width: 140px; }
      .logo { height: 80px; }
      .banner { padding-left: 28px; }
    }
  </style>
